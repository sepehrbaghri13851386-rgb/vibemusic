{% load static %}
<!DOCTYPE html>
<html dir="ltr" lang="en-US">
<head>
<meta charset="utf-8">
<title>Sign In | Vibe Music</title>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<link rel="stylesheet" href="{% static 'libs/slick-carousel/slick/slick.css' %}" type="text/css">
<link rel="stylesheet" href="{% static 'libs/slick-carousel/slick/slick-theme.css' %}" type="text/css">
<link rel="stylesheet" href="{% static 'assets/css/bootstrap.css' %}" type="text/css">
<link rel="stylesheet" href="{% static 'assets/css/theme.css' %}" type="text/css">
<link rel="stylesheet" href="{% static 'assets/css/style.css' %}" type="text/css">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<style>
* { font-family: 'Poppins', sans-serif !important; margin: 0; padding: 0; box-sizing: border-box; }

body {
    min-height: 100vh;
    background: #0a0a14;
    display: flex;
    align-items: center;
    justify-content: center;
    background-image: url('{% static "assets/img/wp15051056-central-cee-desktop-wallpapers.webp" %}');
    background-size: cover;
    background-position: center;
    background-attachment: fixed;
    position: relative;
}

body::before {
    content: '';
    position: fixed;
    top: 0; left: 0; right: 0; bottom: 0;
    background: linear-gradient(135deg, rgba(10,10,20,0.92) 0%, rgba(26,26,46,0.88) 50%, rgba(10,10,20,0.92) 100%);
    z-index: 0;
}

.login-container {
    position: relative;
    z-index: 1;
    width: 100%;
    max-width: 440px;
    padding: 20px;
}

.login-card {
    background: rgba(255,255,255,0.03);
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
    border: 1px solid rgba(255,255,255,0.06);
    border-radius: 24px;
    padding: 48px 40px;
    box-shadow: 0 25px 60px rgba(0,0,0,0.5);
}

.login-logo {
    text-align: center;
    margin-bottom: 35px;
}

.login-logo img {
    width: 60px;
    height: 60px;
    border-radius: 50%;
    object-fit: cover;
    border: 3px solid rgba(247, 151, 30, 0.3);
    margin-bottom: 15px;
}

.login-logo h2 {
    font-size: 1.8rem;
    font-weight: 700;
    background: linear-gradient(135deg, #f7971e, #ffd200);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    margin-bottom: 5px;
}

.login-logo p {
    color: rgba(255,255,255,0.4);
    font-size: 14px;
}

.form-group {
    margin-bottom: 20px;
}

.form-group label {
    color: rgba(255,255,255,0.6);
    font-size: 13px;
    font-weight: 500;
    margin-bottom: 8px;
    display: block;
}

.form-control {
    width: 100%;
    background: rgba(255,255,255,0.05) !important;
    border: 1px solid rgba(255,255,255,0.08) !important;
    border-radius: 12px;
    padding: 14px 18px;
    color: #fff !important;
    font-size: 14px;
    transition: all 0.3s ease;
}

.form-control:focus {
    border-color: rgba(247, 151, 30, 0.4) !important;
    box-shadow: 0 0 0 3px rgba(247, 151, 30, 0.1) !important;
    outline: none;
}

.form-control::placeholder {
    color: rgba(255,255,255,0.25);
}

.password-wrapper {
    position: relative;
}

.password-toggle {
    position: absolute;
    right: 14px;
    top: 50%;
    transform: translateY(-50%);
    background: none;
    border: none;
    color: rgba(255,255,255,0.4);
    cursor: pointer;
    padding: 5px;
    transition: color 0.3s;
}

.password-toggle:hover {
    color: #f7971e;
}

.btn-login {
    width: 100%;
    padding: 14px;
    border: none;
    border-radius: 12px;
    background: linear-gradient(135deg, #f7971e, #ffd200);
    color: #1a1a2e;
    font-size: 15px;
    font-weight: 700;
    cursor: pointer;
    transition: all 0.3s ease;
    margin-top: 10px;
}

.btn-login:hover {
    transform: translateY(-2px);
    box-shadow: 0 10px 30px rgba(247, 151, 30, 0.3);
}

.form-footer {
    text-align: center;
    margin-top: 25px;
    padding-top: 20px;
    border-top: 1px solid rgba(255,255,255,0.06);
}

.form-footer p {
    color: rgba(255,255,255,0.4);
    font-size: 13px;
}

.form-footer a {
    color: #f7971e;
    text-decoration: none;
    font-weight: 600;
    transition: color 0.3s;
}

.form-footer a:hover {
    color: #ffd200;
}

.form-options {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 20px;
}

.form-options label {
    color: rgba(255,255,255,0.4);
    font-size: 13px;
    display: flex;
    align-items: center;
    gap: 8px;
    cursor: pointer;
}

.form-options label input[type="checkbox"] {
    accent-color: #f7971e;
}

.form-options a {
    color: rgba(255,255,255,0.4);
    font-size: 13px;
    text-decoration: none;
    transition: color 0.3s;
}

.form-options a:hover {
    color: #f7971e;
}

.alert {
    padding: 12px 16px;
    border-radius: 10px;
    margin-bottom: 20px;
    font-size: 13px;
}

.alert-danger {
    background: rgba(233, 69, 96, 0.1);
    border: 1px solid rgba(233, 69, 96, 0.2);
    color: #e94560;
}

.alert-success {
    background: rgba(49, 201, 113, 0.1);
    border: 1px solid rgba(49, 201, 113, 0.2);
    color: #31c971;
}

.home-link {
    position: fixed;
    top: 20px;
    left: 20px;
    z-index: 10;
    color: rgba(255,255,255,0.5);
    text-decoration: none;
    font-size: 14px;
    display: flex;
    align-items: center;
    gap: 8px;
    transition: color 0.3s;
}

.home-link:hover {
    color: #f7971e;
}

@media (max-width: 576px) {
    .login-card {
        padding: 35px 25px;
        border-radius: 18px;
    }
    .login-logo h2 {
        font-size: 1.5rem;
    }
}
</style>
</head>
<body>

<a href="{% url 'home' %}" class="home-link">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
    Back to Home
</a>

<div class="login-container">
    <div class="login-card">
        <div class="login-logo">
            <img src="{% static 'assets/img/logo.jpg' %}" alt="Vibe Music">
            <h2>Welcome Back</h2>
            <p>Sign in to your account</p>
        </div>

        {% if messages %}
        {% for message in messages %}
        <div class="alert alert-{% if message.tags == 'error' %}danger{% else %}success{% endif %}">{{ message }}</div>
        {% endfor %}
        {% endif %}

        <form method="post" action="{% url 'signin' %}{% if request.GET.next %}?next={{ request.GET.next }}{% endif %}">
            {% csrf_token %}

            <div class="form-group">
                <label>Email Address</label>
                <input type="email" name="email" class="form-control" placeholder="Enter your email" value="{{ request.POST.email|default:'' }}" required autofocus>
            </div>

            <div class="form-group">
                <label>Password</label>
                <div class="password-wrapper">
                    <input type="password" name="password" id="id_password" class="form-control" placeholder="Enter your password" required>
                    <button type="button" class="password-toggle" onclick="var p=document.getElementById('id_password');p.type=p.type==='password'?'text':'password';this.innerHTML=p.type==='password'?'👁':'👁‍🗨'">👁</button>
                </div>
            </div>

            <div class="form-options">
                <label><input type="checkbox"> Remember me</label>
                <a href="{% url 'forgot_password' %}">Forgot password?</a>
            </div>

            <button type="submit" class="btn-login">Sign In</button>
        </form>

        <div class="form-footer">
            <p>Don't have an account? <a href="{% url 'signup' %}">Sign Up</a></p>
        </div>
    </div>
</div>

<script src="{% static 'libs/jquery/dist/jquery.min.js' %}"></script>
<script src="{% static 'libs/popper.js/dist/umd/popper.min.js' %}"></script>
<script src="{% static 'libs/bootstrap/dist/js/bootstrap.min.js' %}"></script>
</body>
</html>
