{% load static %}
<!DOCTYPE html>
<html dir="rtl" lang="en-US">
<head>
<meta charset="utf-8">
<title>Set New Password | Vibe Music - Web Music App</title>
<meta name="description" content="Responsive, Bootstrap, BS4">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<link rel="stylesheet" href="{% static 'libs/slick-carousel/slick/slick.css' %}" type="text/css">
<link rel="stylesheet" href="{% static 'libs/slick-carousel/slick/slick-theme.css' %}" type="text/css">
<link rel="stylesheet" href="{% static 'assets/css/bootstrap.css' %}" type="text/css">
<link rel="stylesheet" href="{% static 'assets/css/theme.css' %}" type="text/css">
<link rel="stylesheet" href="{% static 'assets/css/style.css' %}" type="text/css">
</head>
<body class="layout-row bg-dark">
<div class="d-flex flex-column flex"><div class="row no-gutters h-100">
<div class="col-md-6 bg-dark bg-img" style="background-image:url({% static 'assets/img/b9.jpg' %})"><div class="p-3 p-md-5 d-flex flex-column h-100">
<h4 class="mb-3 text-white">Vibe Music</h4>
<div class="text-fade">Web Music App</div>
<div class="d-flex flex align-items-center justify-content-center"></div>
<div class="d-flex text-sm text-fade">
<a href="{% url 'home' %}" class="text-white">About</a><span class="flex"></span>
</div>
</div></div>
<div class="col-md-6" id="content-body"><div class="p-3 p-md-5">
<div>
<h5>Set New Password</h5>
<p class="text-muted my-3">Choose a new password for your account.</p>
</div>
{% if messages %}
<div class="mb-3">
{% for message in messages %}
<div class="alert alert-{% if message.tags == 'error' %}danger{% else %}success{% endif %}">{{ message }}</div>
{% endfor %}
</div>
{% endif %}
<form method="post" action="{% url 'reset_password' token=token %}" class="py-5 my-md-5">
{% csrf_token %}
<div class="form-group"><div class="input-group"><input type="password" name="password" id="id_password" placeholder="New Password (min. 8 characters)" minlength="8" class="form-control" required autofocus><span class="input-group-append"><button type="button" class="btn no-shadow no-bg px-2" onclick="var p=document.getElementById('id_password');p.type=p.type==='password'?'text':'password';this.querySelector('i').setAttribute('data-feather',p.type==='password'?'eye':'eye-off');feather.replace();"><i data-feather="eye"></i></button></span></div></div>
<div class="form-group"><div class="input-group"><input type="password" name="password2" id="id_password2" placeholder="Confirm New Password" minlength="8" class="form-control" required><span class="input-group-append"><button type="button" class="btn no-shadow no-bg px-2" onclick="var p=document.getElementById('id_password2');p.type=p.type==='password'?'text':'password';this.querySelector('i').setAttribute('data-feather',p.type==='password'?'eye':'eye-off');feather.replace();"><i data-feather="eye"></i></button></span></div></div>
<button type="submit" class="btn btn-primary btn-block">Change Password</button>
</form>
<div class="pt-1">Back to<a href="{% url 'signin' %}" class="text-primary font-weight-bold">Sign In</a>
</div>
</div></div>
</div></div>
<script src="{% static 'libs/jquery/dist/jquery.min.js' %}"></script><script src="{% static 'libs/popper.js/dist/umd/popper.min.js' %}"></script><script src="{% static 'libs/bootstrap/dist/js/bootstrap.min.js' %}"></script><script src="{% static 'libs/pjax/pjax.min.js' %}"></script><script src="{% static 'assets/js/ajax.js' %}"></script><script src="{% static 'assets/js/lazyload.config.js' %}"></script><script src="{% static 'assets/js/lazyload.js' %}"></script><script src="{% static 'assets/js/plugin.js' %}"></script><script src="{% static 'libs/scrollreveal/dist/scrollreveal.min.js' %}"></script><script src="{% static 'libs/slick-carousel/slick/slick.min.js' %}"></script><script src="{% static 'libs/feather-icons/dist/feather.min.js' %}"></script><script src="{% static 'assets/js/theme.js' %}"></script>
<script src="https://cdn.jsdelivr.net/npm/twemoji@14.0.2/dist/twemoji.min.js" crossorigin="anonymous"></script>
<script>
document.addEventListener('DOMContentLoaded', function() {
    twemoji.parse(document.body, { folder: 'svg', ext: '.svg', base: 'https://cdn.jsdelivr.net/gh/twitter/twemoji@14.0.2/assets/' });
    var style = document.createElement('style');
    style.textContent = 'img.emoji { height: 1.1em; width: 1.1em; margin: 0 .05em 0 .1em; vertical-align: -0.15em; display: inline; }';
    document.head.appendChild(style);
});
</script>
</body>
</html>
