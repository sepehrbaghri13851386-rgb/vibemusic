{% extends 'base.html' %}
{% load static %}

{% block title %}Home | Vibe Music - Music Web App{% endblock %}

{% block content %}
<style>
/* ===== FIX: center page + remove right/left gaps ===== */
html, body { width: 100% !important; overflow-x: hidden !important; }

#main.layout-row.flex { 
  display: block !important;
  width: 100% !important;
  margin: 0 !important;
}

#content.flex {
  display: block !important;
  width: 100% !important;
  margin: 0 !important;
  padding: 0 !important;
}

.page-container, .page-content {
  width: 100% !important;
  max-width: 100% !important;
  margin: 0 auto !important;
  padding-left: 0 !important;
  padding-right: 0 !important;
}

/* ===== page background like Artists ===== */
body { background: #0a0a14 !important; }

/* ===== HERO (like Artists page) ===== */
.home-hero {
    position: relative;
    width: 100%;
    height: 62vh;
    min-height: 380px;
    max-height: 650px;
    padding-top: 70px;
    box-sizing: border-box;

    background-image: url("{% static 'assets/img/wp15899524.jpg' %}");
    background-size: cover;
    background-position: center 15%;
    overflow: hidden;
}
.home-hero::after{
    content:"";
    position:absolute;
    inset:0;
    background: linear-gradient(
        180deg,
        rgba(10,10,20,0.15) 0%,
        rgba(10,10,20,0.35) 55%,
        #0a0a14 100%
    );
}

.home-hero-content{
    position:relative;
    z-index:2;
    height:100%;
    max-width:980px;
    margin:0 auto;
    padding:0 20px 34px;

    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:flex-end;
    text-align:center;
}

.home-badge{
    display:inline-flex;
    align-items:center;
    gap:10px;
    padding:8px 18px;
    border-radius:999px;
    border:1px solid rgba(247,151,30,0.25);
    background: rgba(247,151,30,0.08);
    color: rgba(255,255,255,0.85);
    font-weight:600;
    letter-spacing:2px;
    text-transform:uppercase;
    margin-bottom:14px;
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
}

.home-title{
    color:#fff;
    font-size:2.7rem;
    font-weight:900;
    margin:0 0 8px;
    letter-spacing:1px;
}

.home-subtitle{
    color: rgba(255,255,255,0.65);
    font-size:1rem;
    letter-spacing:3px;
    text-transform:uppercase;
    margin:0 0 18px;
}

.home-cta{
    display:inline-flex;
    align-items:center;
    justify-content:center;
    padding:12px 22px;
    border-radius:999px;
    background: linear-gradient(135deg, #f7971e, #ffd200);
    color:#14141f !important;
    font-weight:800;
    text-decoration:none;
    transition: transform .2s ease, box-shadow .2s ease;
    box-shadow: 0 12px 35px rgba(247,151,30,0.25);
}
.home-cta:hover{
    transform: translateY(-2px);
    box-shadow: 0 18px 45px rgba(247,151,30,0.35);
    text-decoration:none;
}

/* ===== CONTENT ===== */
.home-wrap{
    max-width:980px;
    margin:0 auto;
    padding:26px 16px 30px;
}

.section-title{
    color:#fff;
    font-size:1.35rem;
    font-weight:800;
    margin:0 0 18px;
    display:flex;
    align-items:center;
    gap:14px;
}
.section-title span:first-child{
    background: linear-gradient(135deg, #f7971e, #ffd200);
    -webkit-background-clip:text;
    -webkit-text-fill-color:transparent;
    background-clip:text;
}
.section-title .line{
    flex:1;
    height:2px;
    background: linear-gradient(to left, #f7971e, transparent);
}

/* cards like Artists list items */
.home-card{
    display:flex;
    align-items:center;
    gap:14px;
    background: rgba(255,255,255,0.04);
    border: 1px solid rgba(255,255,255,0.06);
    border-radius:16px;
    padding:14px 16px;
    text-decoration:none;
    transition: all .25s ease;
}
.home-card:hover{
    background: rgba(247,151,30,0.08);
    border-color: rgba(247,151,30,0.3);
    text-decoration:none;
}
.home-card .icon{
    width:54px;
    height:54px;
    border-radius:50%;
    display:grid;
    place-items:center;
    flex-shrink:0;

    background: rgba(247,151,30,0.10);
    border:2px solid rgba(247,151,30,0.25);
    color:#ffd200;
    font-size:22px;
}
.home-card .info{ flex:1; min-width:0; }
.home-card .title{
    color:#fff;
    font-weight:800;
    margin:0;
    font-size:1rem;
}
.home-card .meta{
    margin-top:4px;
    color: rgba(255,255,255,0.5);
    font-size:13px;
}
.home-card .chev{
    color: rgba(255,255,255,0.35);
    font-size:22px;
    line-height:1;
}

@media (max-width: 767.98px){
    .home-hero{ height:54vh; min-height:320px; padding-top:60px; }
    .home-title{ font-size:2.0rem; }
    .home-subtitle{ font-size:0.85rem; letter-spacing:2px; }
}
</style>

<!-- HERO -->
<section class="home-hero">
    <div class="home-hero-content">
        <div class="home-badge">Premium Music</div>
        <h1 class="home-title">VIBE MUSIC</h1>
        <p class="home-subtitle">Discover New Music</p>
        <a class="home-cta no-ajax" href="{% url 'discover' %}">Explore Music</a>
    </div>
</section>

<!-- CONTENT -->
<section class="home-wrap">
    <div class="section-title">
        <span>Explore</span><span class="line"></span>
    </div>

    <a class="home-card no-ajax" href="{% url 'artists' %}">
        <div class="icon">🏆</div>
        <div class="info">
            <div class="title">Artists</div>
            <div class="meta">Browse artists and their tracks</div>
        </div>
        <div class="chev">›</div>
    </a>

    <div style="height:12px;"></div>

    <a class="home-card no-ajax" href="{% url 'genres' %}">
        <div class="icon">♫</div>
        <div class="info">
            <div class="title">Genres</div>
            <div class="meta">Find music by mood and style</div>
        </div>
        <div class="chev">›</div>
    </a>
</section>
{% endblock %}
